<!-- 芯荷肌膚養護 HERVIVE STUDIO - SPA 首次加載過渡 (防白屏/閃爍) -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #FAF4EE;
    height: 100%;
  }
  .spa-loader-root {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #FAF4EE;
    z-index: 99999;
  }
  .spa-loader-glow {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(197, 168, 128, 0.15) 0%, rgba(21, 67, 55, 0.05) 50%, transparent 70%);
    pointer-events: none;
  }
  .spa-loader-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 32px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(197, 168, 128, 0.3);
    box-shadow: 0 16px 36px -8px rgba(21, 67, 55, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .spa-loader-spinner {
    width: 34px;
    height: 34px;
    border: 2px solid rgba(197, 168, 128, 0.25);
    border-top-color: #154337;
    border-radius: 50%;
    animation: spa-spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
  }
  .spa-loader-text {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #8A6A3B;
    text-transform: uppercase;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  @keyframes spa-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<div class="spa-loader-root">
  <div class="spa-loader-glow"></div>
  <div class="spa-loader-card">
    <div class="spa-loader-spinner"></div>
    <div class="spa-loader-text">HERVIVE STUDIO</div>
  </div>
</div>
